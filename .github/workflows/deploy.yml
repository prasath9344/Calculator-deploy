name: Deploy to EC2 via Docker

on:
  push:
    branches:
      - main  # deploy when main branch updates
      - test   #add your current branch
  workflow_dispatch:  # allows manual trigger from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t myapp .

      - name: Save Docker image as tar
        run: docker save myapp > myapp.tar

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}        # 👈 Must be valid
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./build/*"
          target: "/var/www/html"


      - name: SSH and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}        # 👈 Must be valid
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          
          port: 22
          script: |
              # Add user to docker group (if not already added)
              sudo usermod -aG docker $USER || true

              # Install Docker if not present
              if ! command -v docker &> /dev/null; then
                echo "Installing Docker..."
                sudo apt-get update -y
                sudo apt-get install -y docker.io
                sudo systemctl enable docker
                sudo systemctl start docker
              fi

              # Deploy container
              mkdir -p ~/app
              cd ~/app
              sudo docker load < myapp.tar
              sudo docker stop myapp || true
              sudo docker rm myapp || true
              sudo docker run -d -p 3000:3000 --name myapp myapp